[package]
name = "leaf"
version = "0.1.0"
description = "leaf Mac 앱: iPhone에서 받은 스캔을 보정, OCR, AI 정리, 내보내기"
edition = "2024"
publish = false

[lib]
name = "leaf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
leaf-core = { path = "../crates/leaf-core" }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "fs", "io-util", "sync", "time", "macros"] }
mdns-sd = "0.21"
keyring = "4"
getrandom = "0.3"
sha2 = "0.10"
hex = "0.4"
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSLocale", "NSString", "NSArray"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tempfile = "3"
