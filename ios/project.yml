# xcodegen generate 로 Leaf.xcodeproj를 만든다(생성물은 커밋하지 않음). docs/ios.md
name: Leaf
options:
  bundleIdPrefix: com.nobel6018
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # AltStore가 설치할 때 무료 Apple ID로 다시 서명한다. 빌드 단계에서는 서명하지 않는다(sori와 같음)
    CODE_SIGNING_ALLOWED: "NO"
targets:
  Leaf:
    type: application
    platform: iOS
    sources: [Leaf]
    info:
      path: Leaf/Info.plist
      properties:
        CFBundleDisplayName: leaf
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: 거치대에 올린 종이와 책을 촬영합니다.
        NSLocalNetworkUsageDescription: 같은 Wi-Fi에 있는 Mac으로 스캔을 보냅니다.
        NSBonjourServices: [_leaf._tcp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nobel6018.leaf
  LeafTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LeafTests]
    dependencies:
      - target: Leaf
