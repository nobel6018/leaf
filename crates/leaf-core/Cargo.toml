[package]
name = "leaf-core"
version = "0.1.0"
edition = "2024"
description = "leaf 문서 형식(manifest.json). Mac 앱이 읽고 쓰며, iPhone 앱은 같은 형식을 Swift로 따른다 (docs/document-format.md)"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }

hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
