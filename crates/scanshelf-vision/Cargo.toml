[package]
name = "scanshelf-vision"
version = "0.1.0"
edition = "2024"
description = "scanshelf 이미지 처리: 두 페이지 분리, 곡면 보정, 조명 보정, 손가락과 필기 지우기 (docs/vision.md)"
publish = false

[dependencies]
scanshelf-core = { path = "../scanshelf-core" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rayon = "1.12"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-native", "copy-dylibs", "api-31"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["coreml"] }

[dev-dependencies]
imageproc = "0.27"
ab_glyph = "0.2"
