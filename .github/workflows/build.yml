name: build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --no-banner --redact

  mac:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # 의존성 빌드 방식을 바꾸면(링크 옵션, C 런타임 등) 옛 캐시를 쓰지 않게 키를 올린다
          prefix-key: v1-debug
      - run: pnpm install --frozen-lockfile
      # 프론트 빌드 결과(dist)가 있어야 tauri::generate_context!가 컴파일된다
      - run: pnpm build
      - run: cargo clippy --locked --all-targets -- -D warnings
      # 빌드와 실행을 나눠, 멈추면 컴파일인지 테스트 실행인지 바로 구분한다
      - name: cargo test (build)
        run: cargo test --locked --no-run
      - name: cargo test (run)
        timeout-minutes: 15
        run: cargo test --locked

  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen
      - name: test
        working-directory: ios
        run: |
          xcodegen generate
          DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcodebuild test -project Leaf.xcodeproj -scheme Leaf \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO
